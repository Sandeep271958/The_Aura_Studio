; PlatformIO Project Configuration File for THE AURA STUDIO ESP32 Smart Light Hub
; Designed by Sandy
; Supports ESP32 NodeMCU, WROOM, or ESP32-S3

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs

; Optimized upload speed
upload_speed = 921600

; Library dependencies for AsyncWebServer, FastLED, and JSON
lib_deps =
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
    fastled/FastLED @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.0.4

build_flags = 
    -DASYNCWEBSERVER_REGEX
    -DCORE_DEBUG_LEVEL=0
